plugins {
    id 'architectury-plugin'
    id 'dev.architectury.loom'
}

architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // ── Local libs (ForgeConfigAPIPort, architectury-api, geckolib, etc.) ──
    // These JARs live in the project's libs/ folder and are needed at compile
    // time for the common module.  fabric/build.gradle already references them
    // for the platform-specific compilation; adding them here too so common
    // can see ForgeConfigAPIPort, geckolib, architectury-injectables, etc.
    implementation fileTree(dir: rootProject.file('libs'), include: ['*.jar'])

    // Architectury injectables (annotations used in common cross-platform code)
    compileOnly "dev.architectury:architectury-injectables:1.0.13"
}
