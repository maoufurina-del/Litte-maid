plugins {
    id "maven-publish"
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// DIPERBARUI: Menggunakan format Gradle 9.x untuk menggantikan archivesBaseName lama
base {
    archivesName = "yes-steve-model-common"
}

loom {
    accessWidenerPath = file("src/main/resources/yes_steve_model.accesswidener")
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    // Memuat pustaka dasar Minecraft sesuai versi properti yang ditentukan (1.21.11)
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Forge Config API Port
    modImplementation "maven.modrinth:forge-config-api-port:${rootProject.forge_config_api_port_version}"

    // [FIX] architectury-injectables — wajib ada agar @ExpectPlatform bisa dikompilasi
    compileOnly "dev.architectury:architectury-injectables:${rootProject.architectury_api_version}"
    annotationProcessor "dev.architectury:architectury-injectables:${rootProject.architectury_api_version}"

    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

// Native build (CMake) — DIMATIKAN.
tasks.register('compileNative') {
    enabled = false
    doLast {
        println "compileNative is disabled. Enable it manually if you have CMake + native toolchain."
    }
}

processResources.dependsOn compileNative

tasks.withType(JavaCompile).configureEach {
    options.failOnError = false
}

java {
    withSourcesJar()
}

// [FIX] Gunakan archiveClassifier (property) bukan classifier (method) untuk Gradle 8.x+
jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = sourcesJar
    from commonSources.archiveFile.map { zipTree(it) }
}

// [FIX] Publishing block - butuh maven-publish plugin
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "yes-steve-model-common"
            from components.java
        }
    }
    repositories {
    }
}
