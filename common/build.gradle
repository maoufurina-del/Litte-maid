architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

base {
    archivesName = "yes-steve-model-common"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings loom.officialMojangMappings()
    
    // KEMBALIKAN: Fabric Loader agar @Environment berfungsi
    modImplementation "net.fabricmc:fabric-loader:0.19.3"
    
    // PERBAIKAN: Architectury versi 13.0.8 & Injectables versi 1.0.13
    modCompileOnly "dev.architectury:architectury:13.0.8"
    compileOnly "dev.architectury:architectury-injectables:1.0.13"
    
    // KEMBALIKAN: Forge Config API Port agar ForgeConfigSpec berfungsi
    modCompileOnly "maven.modrinth:forge-config-api-port:21.1.6"
    
    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

tasks.register('compileNative') {
    enabled = false
}

processResources.dependsOn compileNative

tasks.withType(JavaCompile).configureEach {
    options.failOnError = false
}
