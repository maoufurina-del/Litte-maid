dependencies {
    // Kami menggunakan versi dari rootProject (gradle.properties)
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    
    // Mappings resmi dari Mojang
    mappings loom.officialMojangMappings()
    
    // Dependency untuk Architectury agar @ExpectPlatform berfungsi
    modImplementation "dev.architectury:architectury:${rootProject.architectury_version}"
    compileOnly "dev.architectury:architectury-injectables:${rootProject.architectury_version}"
}
