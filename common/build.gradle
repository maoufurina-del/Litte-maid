plugins {
    id 'java-library'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
}

// Gunakan semua jar yang ada di fabric/libs sebagai dependency fallback.
// Ini memastikan :common bisa compile tanpa mendownload artifact remote.
dependencies {
    // gunakan semua JAR di root/libs sebagai fallback
    implementation files(rootProject.fileTree(dir: 'libs', include: ['*.jar']))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
