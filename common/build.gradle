/**
 * FIX: Tambahkan baris-baris yang ditandai // [FIX] ke common/build.gradle kamu.
 * Jika kamu sudah punya common/build.gradle, JANGAN ganti semua isinya —
 * cukup tambahkan baris yang bertanda [FIX] ke dalam blok yang sesuai.
 *
 * File ini hanya contoh template. Sesuaikan versi dengan gradle.properties kamu.
 */

architectury {
    common('fabric')
}

loom {
    accessWidenerPath = project(':common').file("src/main/resources/yes_steve_model.accesswidener")
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Architectury API
    modApi "dev.architectury:architectury:${architectury_version}"

    // [FIX] architectury-injectables — wajib ada agar @ExpectPlatform bisa dikompilasi
    // Tambahkan dua baris ini ke dependencies common/build.gradle kamu:
    compileOnly     "dev.architectury:architectury-injectables:${architectury_version}"
    annotationProcessor "dev.architectury:architectury-injectables:${architectury_version}"
}

java {
    withSourcesJar()
}

jar {
    classifier "dev"
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
