plugins {
    id 'java-library'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
}

// Use all jars in root/libs as fallback dependencies
dependencies {
    implementation files(rootProject.fileTree(dir: 'libs', include: ['*.jar']))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
