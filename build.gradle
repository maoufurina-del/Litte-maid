// Root build.gradle — minimal setup for multi-project Fabric + Loom
buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.terraformersmc.com/' }
        maven { url 'https://maven.shedaniel.me/' }
        maven { url 'https://jitpack.io' }
        flatDir { dirs 'libs' }
    }
}

subprojects {
    apply plugin: 'java'

    group = rootProject.hasProperty('maven_group') ? rootProject.maven_group : 'rip.ysm'
    version = rootProject.hasProperty('mod_version') ? rootProject.mod_version : '1.0.0'

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
