// Root build.gradle — minimal setup for multi-project Fabric + Loom
buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.terraformersmc.com/' }
        maven { url 'https://maven.shedaniel.me/' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.architectury.dev/' }
        flatDir { dirs 'libs' }
    }
}

// Configuration to fetch required local libs automatically if they are not present in ./libs
configurations.register('fetchLibs')

dependencies {
    // Try to resolve common third-party jars from repositories. If not available, Gradle will fail and you can provide jars in ./libs
    // Coordinates can be adjusted in gradle.properties
    fetchLibs "dev.architectury:architectury:${architectury_api_version}"
    fetchLibs "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    fetchLibs "software.bernie:geckolib-fabric:${geckolib_version}"
}

task prepareLibs(type: Copy) {
    description = 'Resolve and copy fetchLibs configuration into ./libs'
    group = 'setup'
    from { configurations.fetchLibs.get().resolve() }
    into "$rootDir/libs"
    doFirst { file("$rootDir/libs").mkdirs() }
}

subprojects {
    // Apply Java plugin to all subprojects so java-related configuration is available
    apply plugin: 'java'

    group = rootProject.hasProperty('maven_group') ? rootProject.maven_group : 'rip.ysm'
    version = rootProject.hasProperty('mod_version') ? rootProject.mod_version : '1.0.0'

    // Configure Java toolchain in a safe way after the java plugin is applied
    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
            }
        }
    }

    // Ensure libs are prepared before any Java compilation
    tasks.withType(JavaCompile).configureEach {
        dependsOn rootProject.tasks.named('prepareLibs')
        options.encoding = 'UTF-8'
    }
}
