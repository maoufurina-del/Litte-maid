plugins {
    id 'base'
}

ext {
    // Versi utama — override lewat gradle.properties bila perlu
    minecraft_version = findProperty('minecraft_version') ?: '1.21.11'
    fabric_loader_version = findProperty('fabric_loader_version') ?: '0.14.24'
    fabric_api_version = findProperty('fabric_api_version') ?: '0.89.0'
    maven_group = findProperty('maven_group') ?: 'com.example'
    mod_version = findProperty('mod_version') ?: '1.0.0'

    // Architectury / libs versions (ditambahkan supaya common/build.gradle tidak gagal)
    architectury_api_version = findProperty('architectury_api_version') ?: '4.0.0'
    geckolib_version = findProperty('geckolib_version') ?: '1.21.11-5.4.5'
    cardinal_components_version = findProperty('cardinal_components_version') ?: '2.8.0' 
    modmenu_version = findProperty('modmenu_version') ?: '4.0.0'
    forge_config_api_port_version = findProperty('forge_config_api_port_version') ?: 'v21.11.1-mc1.21.11-Fabric'
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.terraformersmc.com/' }
        maven { url 'https://maven.shedaniel.me/' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.fabricmc.net/' }
    }
}

// Create fetchLibs if not present (some scripts expect it)
configurations {
    if (!configurations.findByName('fetchLibs')) {
        create('fetchLibs')
    }
}

// Safe prepareLibs: copy jars from fetchLibs or fabric/libs into build/libs
tasks.register('prepareLibs', Copy) {
    description = 'Prepare libs for build (copies jars from fetchLibs or fabric/libs into build/libs).'
    group = 'build'

    def fetchConfigProvider = null
    try {
        fetchConfigProvider = configurations.named('fetchLibs')
    } catch (Exception e) {
        fetchConfigProvider = null
    }
    def fetchConfig = configurations.findByName('fetchLibs')

    from {
        if (fetchConfigProvider != null) {
            try { return fetchConfigProvider.get() } catch (Exception ignored) {}
        }
        if (fetchConfig != null) {
            return fetchConfig
        }
        def libsDir = file('fabric/libs')
        if (libsDir.exists()) {
            return files(libsDir.listFiles().findAll { it.name.toLowerCase().endsWith('.jar') })
        }
        return files()
    }

    into("$buildDir/libs")

    doFirst {
        println "prepareLibs: copying libraries into ${buildDir}/libs"
    }
}

// Ensure assemble/build depends on prepareLibs
tasks.named('assemble') {
    dependsOn tasks.named('prepareLibs')
}

// Default subproject configuration
subprojects {
    repositories { mavenCentral() }

    // Apply java plugin so subprojects get Java configurations
    apply plugin: 'java'

    // Configure Java extension safely after plugin present
    plugins.withId('java') {
        project.extensions.configure(org.gradle.api.plugins.JavaPluginExtension) { javaExt ->
            javaExt.sourceCompatibility = JavaVersion.VERSION_17
            javaExt.targetCompatibility = JavaVersion.VERSION_17
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

// === CRITICAL: Add all jars from fabric/libs to :common classpath as fallback ===
// This makes :common compile even if remote coordinates cannot be resolved.
project(':common') {
    apply plugin: 'java'

    dependencies {
        // Include all jars from fabric/libs so compile won't try to download missing remote deps
        implementation files(rootProject.fileTree(dir: 'fabric/libs', include: ['*.jar']))
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// Helper: list prepared libs
tasks.register('listPreparedLibs') {
    doLast {
        def libsDir = file("$buildDir/libs")
        println "Prepared libs in: ${libsDir}"
        if (libsDir.exists()) libsDir.listFiles()?.each { println it.name } else println "No libs prepared yet."
    }
}
