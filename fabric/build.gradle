// name: fabric/build.gradle
plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.architectury.dev/' }
    flatDir { dirs 'libs' }
}

base {
    archivesName = "yes-steve-model-fabric"
}

// Use any jars present in fabric/libs plus the common project
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':common')
}

processResources {
    inputs.property 'version', project.version
    from(project(':common').sourceSets.main.resources.srcDirs) {
        exclude '**/*.mixins.json'
        exclude 'fabric.mod.json'
    }
    filesMatching('*.mixins.json') { expand version: project.version }
    filesMatching('fabric.mod.json') { expand version: project.version }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Debug remapJar: prints debug info and copies shadowJar output to expected name or fails with clear message
tasks.register('remapJar') {
    dependsOn shadowJar
    doLast {
        println "DEBUG: shadowJar = ${shadowJar}"
        def srcFile = null
        try {
            srcFile = shadowJar.archiveFile.get().asFile
            println "DEBUG: shadowJar.archiveFile resolved to: ${srcFile}"
        } catch(Exception e) {
            println "DEBUG: failed to resolve shadowJar.archiveFile: ${e.class.name}: ${e.message}"
        }

        if (srcFile != null && srcFile.exists()) {
            def destName = "${base.archivesName.get()}-${project.version}-fabric-${rootProject.minecraft_version}.jar"
            def destDir = file("${buildDir}/libs")
            destDir.mkdirs()
            copy {
                from srcFile
                into destDir
                rename { destName }
            }
            println "Fallback remapJar: copied ${srcFile.name} -> ${destDir}/${destName}"
        } else {
            println "DEBUG: listing build/libs contents:"
            file("${buildDir}/libs").listFiles()?.each { println it }
            throw new GradleException("remapJar debug: shadowJar output not found (srcFile=${srcFile}). See debug logs above.")
        }
    }
}

// Keep build dependent on remapJar so existing build flow still produces the jar
build.dependsOn remapJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
