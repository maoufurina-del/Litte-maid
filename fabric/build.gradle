plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.architectury.dev/' }
    flatDir { dirs 'libs' }
}

base {
    archivesName = "yes-steve-model-fabric"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':common')
}

processResources {
    inputs.property 'version', project.version
    from(project(':common').sourceSets.main.resources.srcDirs) {
        exclude '**/*.mixins.json'
        exclude 'fabric.mod.json'
    }
    filesMatching('*.mixins.json') { expand version: project.version }
    filesMatching('fabric.mod.json') { expand version: project.version }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('remapJar') {
    dependsOn shadowJar
    doLast {
        def src = shadowJar.archiveFile.get().asFile
        def destName = "${base.archivesName.get()}-${project.version}-fabric-${rootProject.minecraft_version}.jar"
        def destDir = file("${buildDir}/libs")
        destDir.mkdirs()
        copy {
            from src
            into destDir
            rename { destName }
        }
        println "Fallback remapJar: copied ${src.name} -> ${destDir}/${destName}"
    }
}

build.dependsOn remapJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
