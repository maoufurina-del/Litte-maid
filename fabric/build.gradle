plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

buildscript {
    repositories {
        maven { url 'https://maven.architectury.dev/' } // Architectury plugin repo
        maven { url 'https://maven.fabricmc.net/' }     // Fabric repo
        mavenCentral()
        maven { url 'https://maven.terraformersmc.com/' }
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()
    }
    dependencies {
        classpath "dev.architectury.loom:dev.architectury.loom.gradle.plugin:1.14.8"
    }
}

apply plugin: 'dev.architectury.loom'
apply plugin: 'com.github.johnrengelman.shadow'

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.architectury.dev/' }
    flatDir { dirs 'libs' }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    splitEnvironmentSourceSets()
}

base {
    archivesName = "yes-steve-model-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Replace local jars with Maven coordinates where possible. If a dependency is not published,
    // please provide the jar in libs/ or update the coordinates.
    modImplementation "maven.modrinth:forge-config-api-port:${rootProject.forge_config_api_port_version}"
    modCompileOnly "dev.architectury:architectury:${rootProject.architectury_api_version}"
    modImplementation "software.bernie:geckolib-fabric:${rootProject.geckolib_version}"

    // Cardinal Components
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    implementation 'com.github.TartaricAlkaline:ImageStream:1.0.0'
    
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    
    // DEPENDENCY TO COMMON
    modImplementation project(':common')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('*.mixins.json') { expand version: project.version }
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(project(':common').sourceSets.main.resources.srcDirs) {
        exclude '**/*.mixins.json'
        exclude 'fabric.mod.json'
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName = "${base.archivesName.get()}-${project.version}-fabric-${rootProject.minecraft_version}.jar"
}

build.dependsOn remapJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
