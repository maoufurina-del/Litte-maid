name: Build and Package Fabric Mod

on:
  push:
    branches:
      - main
      - master
      - maoufurina-del-patch-1
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties','**/*.gradle*','**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/build.gradle*','**/settings.gradle*','**/settings.gradle.kts') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Grant execute permission for gradlew (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Show Java & Gradle versions
        if: runner.os != 'Windows'
        run: |
          java -version
          ./gradlew --version

      - name: Show Java & Gradle versions (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          java -version
          gradlew.bat --version

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat clean build --no-daemon --stacktrace

      - name: Collect build outputs
        run: |
          echo "Repository files:"
          ls -la
          echo "Built JARs:"
          ls -la **/build/libs || true

      - name: Upload built mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: litte-maid-mods-${{ github.run_id }}
          path: |
            **/build/libs/*.jar

  lint:
    name: (Optional) Compile-only check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true
      - name: Compile only
        run: ./gradlew :common:compileJava :fabric:compileJava --no-daemon --stacktrace || true
