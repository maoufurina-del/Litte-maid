name: Auto Build Fabric Mod

on:
  push:
    branches: [ 'fix/fabric-1.21.11' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Try to fetch common jars into ./libs
        run: |
          mkdir -p libs
          bash ./scripts/fetch-jars.sh || true

      - name: Prepare libs via Gradle
        run: ./gradlew prepareLibs --no-daemon --stacktrace
        continue-on-error: true

      - name: Build Fabric remapped jar
        run: ./gradlew :fabric:remapJar --no-daemon --stacktrace
        env:
          JAVA_TOOL_OPTIONS: '-Dorg.gradle.jvmargs=-Xmx3G'

      - name: Upload Fabric artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yes-steve-model-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error
