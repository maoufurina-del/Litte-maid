name: Auto Build Fabric Mod (download jars + Fox-Model-Loader)

on:
  push:
    branches: [ 'fix/fabric-1.21.11' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare workspace libs dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/libs"
          ls -la "$GITHUB_WORKSPACE" || true

      - name: Download common libs (Maven Central)
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/libs"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/guava-32.1.2-jre.jar" \
            https://repo1.maven.org/maven2/com/google/guava/guava/32.1.2-jre/guava-32.1.2-jre.jar || echo "guava failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/netty-buffer-4.1.99.Final.jar" \
            https://repo1.maven.org/maven2/io/netty/netty-buffer/4.1.99.Final/netty-buffer-4.1.99.Final.jar || echo "netty-buffer failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/fastutil-8.5.13.jar" \
            https://repo1.maven.org/maven2/it/unimi/dsi/fastutil/8.5.13/fastutil-8.5.13.jar || echo "fastutil failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/joml-1.10.6.jar" \
            https://repo1.maven.org/maven2/org/joml/joml/1.10.6/joml-1.10.6.jar || echo "joml failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/commons-lang3-3.13.0.jar" \
            https://repo1.maven.org/maven2/org/apache/commons/commons-lang3/3.13.0/commons-lang3-3.13.0.jar || echo "commons-lang3 failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/annotations-24.0.1.jar" \
            https://repo1.maven.org/maven2/org/jetbrains/annotations/24.0.1/annotations-24.0.1.jar || echo "annotations failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/commons-io-2.13.0.jar" \
            https://repo1.maven.org/maven2/commons-io/commons-io/2.13.0/commons-io-2.13.0.jar || echo "commons-io failed"
          curl -sfL -o "$GITHUB_WORKSPACE/libs/gson-2.10.1.jar" \
            https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar || echo "gson failed"
          echo "Downloaded libs:"
          ls -lah "$GITHUB_WORKSPACE/libs" || true
        continue-on-error: true

      - name: Build Fox-Model-Loader and copy jars to root/libs
        run: |
          set -euxo pipefail
          TMPDIR=$(mktemp -d /tmp/fox.XXXX)
          git clone --depth 1 --branch 26.1.2Fabric https://github.com/sdf123098/Fox-Model-Loader.git "$TMPDIR" || { echo "Clone failed - branch may not exist"; rm -rf "$TMPDIR"; exit 0; }
          pushd "$TMPDIR"
          chmod +x ./gradlew || true
          ./gradlew build --no-daemon -x test || echo "Fox build failed"
          find . -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -print0 \
            | xargs -0 -I{} cp -v {} "$GITHUB_WORKSPACE/libs/" || true
          popd
          rm -rf "$TMPDIR"
          echo "Workspace libs after Fox-Model-Loader copy:"
          ls -lah "$GITHUB_WORKSPACE/libs" || true
        continue-on-error: true

      - name: Prepare libs via Gradle
        run: ./gradlew prepareLibs --no-daemon --stacktrace
        continue-on-error: true

      - name: Build Fabric remapped jar and capture log
        run: |
          set -o pipefail
          echo "=== START remapJar ==="
          ./gradlew :fabric:remapJar --no-daemon --stacktrace --info 2>&1 | tee gradle-remap.log
          echo "=== END remapJar (exit code: $?) ===" | tee -a gradle-remap.log
        env:
          JAVA_TOOL_OPTIONS: '-Dorg.gradle.jvmargs=-Xmx3G'
        continue-on-error: true

      - name: Upload Gradle remap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-remap-log
          path: gradle-remap.log

      - name: Upload Fabric artifact (jar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yes-steve-model-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: warn
